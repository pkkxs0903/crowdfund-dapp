name: Verify contract on Etherscan

on:
  workflow_dispatch:
    inputs:
      address:
        description: "Deployed contract address"
        required: true
        default: "0x306d64A7F18A0886a5B935931febDAB23D430480"
      fee_recipient:
        description: "Constructor argument (platform fee recipient)"
        required: true
        default: "0x429069184CC214B8B255F74327807660bccADe99"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pre-flight checks
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          if [ -z "$ETHERSCAN_API_KEY" ]; then
            echo "::error::ETHERSCAN_API_KEY secret is MISSING or empty."
            exit 1
          fi
          KEYTEST=$(curl -s "https://api.etherscan.io/v2/api?chainid=11155111&module=proxy&action=eth_blockNumber&apikey=$ETHERSCAN_API_KEY")
          echo "::notice::KEYTEST: ${KEYTEST:0:300}"
          STATUS=$(curl -s "https://api.etherscan.io/v2/api?chainid=11155111&module=contract&action=getsourcecode&address=${{ inputs.address }}&apikey=$ETHERSCAN_API_KEY" | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('result'); r=r[0] if isinstance(r,list) else r; print(d.get('status'), d.get('message'), '| name=', r.get('ContractName') if isinstance(r,dict) else r, '| srclen=', len(r.get('SourceCode','')) if isinstance(r,dict) else 'n/a')")
          echo "::notice::CONTRACT: ${STATUS:0:300}"

      - name: Compile with force
        run: npx hardhat compile --force --verbose

      - name: Verify on Etherscan (Sepolia)
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          set -o pipefail
          npx hardhat verify --network sepolia --show-stack-traces \
            "${{ inputs.address }}" \
            "${{ inputs.fee_recipient }}" 2>&1 | tee verify-log.txt

      - name: Emit failure log as annotations
        if: failure()
        run: |
          if [ -f verify-log.txt ]; then
            # pack lines with %0A so each annotation can hold many lines
            echo "::error::LOG-A: $(sed -n '1,8p' verify-log.txt | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-1500)"
            echo "::error::LOG-B: $(sed -n '9,16p' verify-log.txt | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-1500)"
            echo "::error::LOG-C: $(sed -n '17,30p' verify-log.txt | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-1500)"
          else
            echo "::error::verify-log.txt not found (failed before verify step)."
          fi
