name: Verify contract on Etherscan

on:
  workflow_dispatch:
    inputs:
      address:
        description: "Deployed contract address"
        required: true
        default: "0x306d64A7F18A0886a5B935931febDAB23D430480"
      fee_recipient:
        description: "Constructor argument (platform fee recipient)"
        required: true
        default: "0x429069184CC214B8B255F74327807660bccADe99"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Pre-flight checks
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          if [ -z "$ETHERSCAN_API_KEY" ]; then
            echo "::error::ETHERSCAN_API_KEY secret is MISSING or empty. Add it in Settings > Secrets and variables > Actions (exact name: ETHERSCAN_API_KEY), then re-run."
            exit 1
          fi
          echo "Secret present (length: ${#ETHERSCAN_API_KEY})."
          echo "--- 1) API key validity test ---"
          curl -s "https://api.etherscan.io/v2/api?chainid=11155111&module=proxy&action=eth_blockNumber&apikey=$ETHERSCAN_API_KEY"
          echo ""
          echo "--- 2) Current verification status of target contract ---"
          curl -s "https://api.etherscan.io/v2/api?chainid=11155111&module=contract&action=getsourcecode&address=${{ inputs.address }}&apikey=$ETHERSCAN_API_KEY" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('result'); r=r[0] if isinstance(r,list) else r; print('API status:', d.get('status'), d.get('message')); print('ContractName:', r.get('ContractName') if isinstance(r,dict) else r); print('SourceCode length:', len(r.get('SourceCode','')) if isinstance(r,dict) else 'n/a')"

      - name: Verify on Etherscan (Sepolia)
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          npx hardhat verify --network sepolia --show-stack-traces \
            "${{ inputs.address }}" \
            "${{ inputs.fee_recipient }}"
